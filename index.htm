<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tennis Mafia – Daily match previews &amp; analysis</title>
<meta name="description" content="Daily match previews & analysis. Join Tennis Mafia on Telegram – it's free.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#000;color:#f5f5f5;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;overflow-x:hidden;
}

/* top progress line */
.progress{position:fixed;top:0;left:0;height:2px;width:100%;background:#d9d9d9;z-index:20}
.progress i{display:block;height:100%;width:10%;background:#1a8cff;animation:load 1.6s ease-out forwards}
@keyframes load{to{width:100%}}

/* in-app banner */
.banner{
  background:#f5f5f5;color:#111;text-align:center;font-weight:700;
  font-size:clamp(14px,4.4vw,20px);line-height:1.5;
  padding:18px 24px 16px;margin-top:2px;
}

/* main */
.stage{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 22px calc(40px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 55%,#1a1a1a 0%,#0a0a0a 40%,#000 80%);
  text-align:center;overflow:hidden;
}
.stage::before{ /* soft drifting spotlight */
  content:"";position:absolute;width:520px;height:520px;border-radius:50%;
  top:34%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);
  animation:breathe 6s ease-in-out infinite;pointer-events:none;
}
@keyframes breathe{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}

h1{
  font-size:clamp(34px,10.4vw,48px);font-weight:800;letter-spacing:-.5px;color:#f5f5f5;
  line-height:1.1;position:relative;
}
.sub{margin-top:14px;font-size:clamp(20px,5.6vw,26px);color:#9a9a9a;font-weight:400;position:relative}

/* profile */
.avatar-wrap{
  position:relative;width:min(58vw,230px);aspect-ratio:1;margin:clamp(40px,9vw,64px) 0 clamp(40px,9vw,60px);
  animation:float 4.5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.avatar-wrap::before{ /* rotating light ring */
  content:"";position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 55%,rgba(255,255,255,.9) 78%,transparent 92%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:spin 3.2s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{
  position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  animation:ripple 3s ease-out infinite;
}
.pulse.p2{animation-delay:1.5s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
.avatar{
  position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
  box-shadow:0 0 0 0 rgba(255,255,255,.0),0 18px 50px rgba(0,0,0,.7);
  animation:glow 3.5s ease-in-out infinite;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;user-select:none;-webkit-user-drag:none;
}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.7)}50%{box-shadow:0 0 46px rgba(255,255,255,.25),0 18px 50px rgba(0,0,0,.7)}}
.avatar-wrap:hover .avatar{transform:scale(1.05) rotate(-3deg)}
.avatar.spin{animation:glow 3.5s ease-in-out infinite,flip .9s ease}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.05)}100%{transform:rotateY(360deg)}}

.tagline{font-size:clamp(20px,5.6vw,26px);color:#9a9a9a;line-height:1.4;position:relative}
.brand{margin-top:14px;font-size:clamp(24px,7vw,32px);font-weight:700;color:#f5f5f5;position:relative}
.free{margin-top:14px;font-size:clamp(18px,5.2vw,24px);color:#9a9a9a;position:relative}
.free .arrow-emoji{display:inline-block;animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* button */
.cta{
  position:relative;display:flex;align-items:center;justify-content:center;gap:14px;
  width:100%;max-width:480px;margin-top:clamp(26px,6vw,40px);
  padding:clamp(20px,5vw,28px) 24px;border-radius:999px;
  background:#f5f5f5;color:#111;text-decoration:none;
  font-weight:700;font-size:clamp(20px,5.6vw,26px);letter-spacing:-.2px;
  overflow:hidden;isolation:isolate;
  animation:btnpulse 2.4s ease-in-out infinite;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;
}
@keyframes btnpulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}
  70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.cta::before{ /* shimmer sweep */
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:-1;
  background:linear-gradient(100deg,transparent,rgba(26,140,255,.35),transparent);
  transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite;
}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
.cta svg{width:1.1em;height:1.1em;animation:nudge 1.3s ease-in-out infinite;flex:none}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.cta:hover{transform:translateY(-3px) scale(1.025);box-shadow:0 14px 40px rgba(255,255,255,.22);animation:none}
.cta:hover svg{animation-duration:.6s}
.cta:active{transform:scale(.97)}
.cta:focus-visible,.avatar:focus-visible{outline:3px solid #1a8cff;outline-offset:4px}
.ripple{
  position:absolute;border-radius:50%;background:rgba(26,140,255,.35);
  transform:scale(0);animation:rip .6s linear;pointer-events:none;z-index:-1;
}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* entrance */
.in{opacity:0;transform:translateY(18px);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}
@keyframes rise{to{opacity:1;transform:none}}

@media (min-width:700px){.banner{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
</style>
</head>
